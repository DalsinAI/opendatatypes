# The pack: tools/build_pack.py on stand-ins for the builds, the drawer, the
# icons and the archive, and Install-OpenDatatypes and Uninstall-OpenDatatypes
# run on a stand-in AmigaOS 3.2 disk (tests/pack/test_pack.py). The real
# builds need the os32-gcc16 stove and are made on the build PC.
name: Pack
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LhA tools
        run: sudo apt-get update -q && sudo apt-get install -y -q jlha-utils lhasa
      - name: The pack and its Installer scripts
        run: python3 -I tests/pack/test_pack.py
