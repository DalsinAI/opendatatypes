# The datatypes' decoder cores on the host (x86), under AddressSanitizer and
# UBSan: opentga.datatype's (Datatypes/tests/test-tga.sh) and cdxl.datatype's
# (Datatypes/tests/test-cdxl.sh, with ffmpeg's own CDXL decoder as a check),
# and stream.datatype's with gzip.datatype's and brotli.datatype's
# (Datatypes/tests/test-stream.sh), and the writers: openpng.datatype's
# (Datatypes/tests/test-pngenc.sh), opentga's (test-tgaenc.sh), webp's
# lossless one with libwebp patched as for the Amiga (test-webpenc.sh) and
# gzip's (test-gzenc.sh), each read back by our decoders and by Pillow or
# Python's zlib.
# OpenDatatypes' cores (datatypes.library and its eight class datatypes) under
# qemu-m68k with an m68k cross GCC; the datatypesclass test
# (tests/m68k/test_opendatatypes_class.sh) needs an amigachrome-guest
# checkout (GUEST=) and runs in amigachrome-guest's own CI.
# The Amiga builds need the os32-gcc16 stove and are made on the build PC.
name: Datatypes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg python3-pil
      - name: opentga.datatype decoder
        run: sh Datatypes/tests/test-tga.sh
      - name: cdxl.datatype core
        run: sh Datatypes/tests/test-cdxl.sh
      - name: stream.datatype with gzip and Brotli
        run: sh Datatypes/tests/test-stream.sh
      - name: openpng.datatype's PNG writer
        run: sh Datatypes/tests/test-pngenc.sh
      - name: opentga.datatype's TGA writer
        run: sh Datatypes/tests/test-tgaenc.sh
      - name: webp.datatype's lossless WebP writer
        run: sh Datatypes/tests/test-webpenc.sh
      - name: gzip.datatype's gzip writer
        run: sh Datatypes/tests/test-gzenc.sh
  m68k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: m68k cross GCC, G++ and qemu-m68k
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu g++-m68k-linux-gnu qemu-user
      - name: OpenDatatypes (datatypes.library) core
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_opendatatypes.sh
      - name: OpenDatatypes picture, ilbm, sound and 8svx datatype cores
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_opendatatypes_picsound.sh
      - name: OpenDatatypes text, ascii, animation and anim classes
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_opendatatypes_textanim.sh
